; ============================================================
;  ESP32 Five-Finger Robotic Hand
;  Board  : ESP32 DevKit V1 (ESP-WROOM-32)
;  Port   : COM6  (Silicon Labs CP210x)
;  I2C    : SDA = GPIO22 , SCL = GPIO23
;  PCA9685: address 0x40
; ------------------------------------------------------------
;  DO ENVIRONMENTS hain, kyunki dono programs mein apna
;  setup()/loop() hai -- ek saath compile karne par linker
;  "multiple definition" error dega.
;
;    palm      -> src/palm/main.cpp       (5 ungli, asli kaam)
;    ch0_test  -> src/ch0_test/main.cpp   (Phase 2+3 ka I2C + CH0 test)
;
;  CHALANE KE COMMANDS:
;    pio run -e palm -t upload          <- palm firmware chadhao
;    pio run -e palm -t monitor         <- serial monitor kholo
;    pio run -e palm -t upload -t monitor   <- dono ek saath
;    pio run -e ch0_test -t upload      <- purana test (wiring shaq ho to)
;
;  Note: 'pio' PATH par nahi hai, poora path use karo:
;    C:\Users\Hp\.platformio\penv\Scripts\pio.exe
; ============================================================

[platformio]
; Bina -e likhe 'pio run' chalao to default yeh banega
default_envs = palm

; ---- Common settings: dono environments inhe inherit karte hain ----
[env]
platform  = espressif32@6.4.0
board     = esp32doit-devkit-v1
framework = arduino

; ---- Serial monitor ----
monitor_speed   = 115200
monitor_port    = COM6
monitor_filters = esp32_exception_decoder

; ---- Upload ----
upload_port  = COM6
upload_speed = 460800

; ---- Libraries ----
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2

; ============================================================
;  ENV 1 : PALM  --  paanch ungli ka control (default)
; ============================================================
[env:palm]
build_src_filter = +<palm/>

; ============================================================
;  ENV 2 : CH0 TEST  --  Phase 2+3, sirf I2C scan + ek servo
; ============================================================
[env:ch0_test]
build_src_filter = +<ch0_test/>

; ============================================================
;  ENV 3 : SERVO DIRECT  --  diagnostic, PCA9685 beech se hata ke
;  Servo ka orange taar ESP32 ke D18 par. Red/brown jahan the wahin.
; ============================================================
[env:servo_direct]
build_src_filter = +<servo_direct/>
; Is test ko PCA9685 library ki zarurat nahi -- inherited lib_deps hata do
lib_deps =
